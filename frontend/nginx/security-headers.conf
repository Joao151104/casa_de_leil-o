# Incluído em cada location: no nginx, um add_header dentro do location anula os herdados do server.
# Sem HSTS de propósito: o Safari aplicaria a regra até em http://localhost.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
