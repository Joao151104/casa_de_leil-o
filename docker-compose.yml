# Sobe os três serviços: `docker compose up --build`
#   frontend → http://localhost:8080   (nginx: SPA + proxy de /api e /socket.io)
#   backend  → http://localhost:3333   (API Node + Socket.IO)
#   db       → localhost:5432          (PostgreSQL)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leilao
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria também o banco usado pelos testes automatizados do backend
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d leilao']
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@db:5432/leilao
      # Valores de exemplo para rodar localmente. Em produção, use segredos fortes.
      JWT_SECRET: compose-jwt-secret
      LEDGER_SIGNING_SECRET: compose-ledger-secret
      PSEUDONYM_SECRET: compose-pseudonym-secret
      SEED_ON_BOOT: 'true'
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3333/api/health >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3333
    ports:
      - '8080:80'

volumes:
  pgdata:
